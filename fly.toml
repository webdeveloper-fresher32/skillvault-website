app = "skillvault-website"
primary_region = "iad"

[build]
  dockerfile = "Dockerfile"

[env]
  CONTENT_PATH = "/content"
  PORT = "8080"
  JAVA_TOOL_OPTIONS = "-Xmx384m -XX:+UseG1GC"

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = "off"
  auto_start_machines = true
  min_machines_running = 1
  processes = ["app"]

[[vm]]
  memory = "512mb"
  cpu_kind = "shared"
  cpus = 1
